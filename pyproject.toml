[project]
name = "ocab"
version = "0.1.0"
description = "Hydrological data processing for CAMELS-ES and BEAVERS-ES"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "geopandas>=1.1.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    # "lisflood-preprocessing",
    "lxml>=6.1.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "netcdf4>=1.7.4",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "pyarrow>=23.0.1",
    "pyflwdir>=0.5.10",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rechunker>=0.5.2",
    "reservoirs-lshm",
    "rioxarray>=0.21.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "xarray>=2025.11.0",
    "xclim>=0.61.0",
    "zarr>=3.1.5",
]

[tool.uv]
package = true

[tool.uv.sources]
reservoirs-lshm = { git = "https://github.com/casadoj/reservoirs-LSHM.git" }

# [tool.uv.sources]
# lisflood-preprocessing = { git = "https://github.com/casadoj/lisflood-preprocessing.git" }

[project.scripts]
zarrify = "ocab.zarrify:main"
basin-delineation = "ocab.basins.delineate.main:main"
basin-stats = "ocab.basins.stats.main:main_script"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
