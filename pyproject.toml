[project]
name = "camels-es"
version = "0.1.0"
description = "Hydrological data processing for CAMELS-ES"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "dask>=2026.1.2",
    "geopandas>=1.1.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "lisflood-preprocessing",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "netcdf4>=1.7.4",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "pyarrow>=23.0.1",
    "pyyaml>=6.0.3",
    "rechunker>=0.5.2",
    "rioxarray>=0.21.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "xarray>=2025.11.0",
    "zarr>=3.1.5",
]

[tool.uv]
package = true

[tool.uv.sources]
lisflood-preprocessing = { git = "https://github.com/casadoj/lisflood-preprocessing.git" }

[project.scripts]
zarrify = "camels_es.zarrify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
