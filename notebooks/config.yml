# directorios de trabajo
rutas:
    anuario_aforos:
        orig: /mnt/c/Datasets/CAMELS-ES/raw/2020-2021
        repo: /mnt/c/Datasets/CAMELS-ES/
    EFAS: 
        orig: /mnt/c/Datasets/EFASv/maps/Iberia
        repo: ../../data/EFAS5
    EMO:
        orig: /mnt/c/Datasets/EMO1
        repo: ../../data/EMO1
    CAMELS: 
        orig: /mnt/c/Datasets/CAMELS-ES
        repo: ../../data/CAMELS-ES
        
# configuración de CAMELS-ES
CAMELS-ES:
    version: 1.2.0
    # periodo de estudio
    periodo:
        inicio: 1991-10-01
        final: 2021-09-30
    # límites de área de cuenca
    area:
        min: 20
        max:
    # disponibilidad mínima de datos de caudal
    caudal:
        disponibilidad: 0.9
        n_años: 4

# configuración del modelo LSTM
modelo:
    train_size: .6
    val_size: .2
    seed: 123
crs: 4326 #'epsg:4326'


