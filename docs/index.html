<!DOCTYPE html>
<html>
<head>
    <title>CAMELS-ES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 700px; width: 100%; border-radius: 8px; }
        body { font-family: sans-serif; margin: 20px; }
    </style>
</head>
<body>
    <h1>CAMELS-ES Explorer</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Spain
        var map = L.map('map').setView([40.4167, -3.7037], 6);

        // Add a clean base map
        var standard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Add the Relief Map (OpenTopoMap)
        var relief = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OSM, SRTM | Style: &copy; OpenTopoMap'
        });
        relief.addTo(map);

        // Create a specific pane for basins & rivers to keep them at the bottom
        map.createPane('basinPane');
        map.getPane('basinPane').style.zIndex = 200;
        map.createPane('riverPane');
        map.getPane('riverPane').style.zIndex = 390;

        // Add a layer toggle (Top Right corner)
        var baseMaps = {
            "Relief (DEM)": relief,
            "Standard Map": standard
        };
        L.control.layers(baseMaps).addTo(map);
        
        // Load Basins GeoJSON
        fetch('./demarcaciones.geojson')
            .then(res => {
                if (!res.ok) throw new Error("Could not load Basins GeoJSON file");
                return res.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            color: 'black',
                            weight: 1.5,
                            fillOpacity: 0.,
                            lineJoin: 'round',
                            pane: 'basinPane'
                        };
                    },
                    interactive: false
                }).addTo(map);
            });

        // Load Rivers GeoJSON
        fetch('./rios.geojson')
            .then(res => {
                if (!res.ok) throw new Error("Could not load Rivers GeoJSON file");
                return res.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            color: 'steelblue',
                            weight: 1.2,
                            opacity: 0.7,
                            lineJoin: 'round',
                            pane: 'riverPane'
                        };
                    },
                    interactive: false
                }).addTo(map);
            });
        
        // Helper function for Title Case
        function toTitleCase(str) {
            return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        }

        // Load Stations GeoJSON file
        fetch('./estaciones.geojson')
            .then(res => {
				if (!res.ok) throw new Error("Could not load stations GeoJSON file");
				return res.json();
			})
            .then(data => {
                console.log("Data loaded successfully:", data);
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            color: 'white',
                            weight: 2,
                            fillColor: 'maroon',
                            fillOpacity: 1
                        });
                },
                onEachFeature: function (feature, layer) {
                    let props = feature.properties;
                    let name = toTitleCase(props.lugar || props.LUGAR || "Name");
                    let id = props.indroea || props.INDROEA || "ID";
                    let river = toTitleCase(props.rio || props.RIO || "River");
                    let basin = toTitleCase(props.cuenca || props.CUENCA || "Basin");
                    let link = props.url_link || props.URL_LINK || "#";
                    layer.bindPopup(`
                        <strong>${id} - ${name}</strong><br>
                        River: ${river}<br>
                        Basin: ${basin}<br>
                        <a href="${link}">View Hydrograph</a>
                    `);
                }
            }).addTo(map);
            });
    </script>
</body>
</html>
