<!DOCTYPE html>
<html>
<head>
    <title>CAMELS-ES</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; border-radius: 8px; }
        body { font-family: sans-serif; margin: 20px; }
    </style>
</head>
<body>
    <h1>CAMELS-ES Explorer</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Spain
        var map = L.map('map').setView([40.4167, -3.7037], 6);

        // Add a clean base map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Load your GeoJSON file
        fetch('./estaciones.geojson')
            .then(res => {
				if (!res.ok) throw new Error("Could not load GeoJSON file");
				return res.json();
			})
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        // Create a popup with a link
                        let name = feature.properties.lugar || "Station " + feature.properties.indroea;
                        let popupContent = `
                            <strong>${name}</strong><br>
                            <a href="${feature.properties.url_link}">View Hydrograph</a>
                        `;
                        layer.bindPopup(popupContent);
                        
                        // Optional: Open link on double click
                        layer.on('dblclick', function() {
                            window.location.href = feature.properties.url_link;
                        });
                    }
                }).addTo(map);
            });
    </script>
</body>
</html>
