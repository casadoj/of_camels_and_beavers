                        "&entry." + stationEntryId + "=" + stationId +

                        "&entry." + startEntry1Id + "=" + start + 
                        "&entry." + endEntry1Id + "=" + end +
                        "&entry." + startEntry2Id + "=" + start +

                    document.getElementById('form-container').innerHTML =
