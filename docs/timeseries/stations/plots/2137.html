                    document.getElementById('form-container').innerHTML = 
                        '<iframe src="' + finalUrl + '" frameborder="0">Loading form…</iframe>';
                })();

                window.addEventListener('load', function() {
                    setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 200); 
                });
            </script>
